# NexusCheatFramework CI
# Builds and tests on every push and pull request to main/develop/active branches.
name: CI

on:
  push:
    branches: [ main, develop, active, claude/* ]
  pull_request:
    branches: [ main, develop, active ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NexusCheatFramework.sln

      - name: Build Debug
        run: dotnet build NexusCheatFramework.sln -c Debug --nologo

      - name: Test Debug
        run: dotnet test NexusCheatFramework.sln -c Debug --nologo --no-build

      - name: Build Release
        run: dotnet build NexusCheatFramework.sln -c Release --nologo

      - name: Test Release
        run: dotnet test NexusCheatFramework.sln -c Release --nologo --no-build

  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NexusCheatFramework.sln

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore
