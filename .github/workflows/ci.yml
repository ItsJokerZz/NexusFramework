# NexusCheatFramework CI
# Builds and tests on every push and pull request to main/develop branches.
name: CI

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            # netstandard2.1 is included; SDK >= 8.0 can build it

      - name: Restore
        run: dotnet restore NexusCheatFramework.sln

      - name: Build
        run: dotnet build NexusCheatFramework.sln -c Release --nologo

      - name: Test
        run: dotnet test NexusCheatFramework.sln -c Release --nologo --no-build

  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NexusCheatFramework.sln

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore
