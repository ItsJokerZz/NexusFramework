name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "NexusCheatFramework/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "NexusCheatFramework/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NexusCheatFramework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore NexusCheatFramework.sln
      - run: dotnet build   NexusCheatFramework.sln -c Release --no-restore
      - run: dotnet test    NexusCheatFramework.sln -c Release --no-build --logger "trx;LogFileName=test_results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: NexusCheatFramework/**/test_results.trx
